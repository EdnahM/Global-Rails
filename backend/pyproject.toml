[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "african-rails-mcp"
version = "0.1.0"
description = "Blockchain payment infrastructure MCP for African AI agents"
requires-python = ">=3.10"
dependencies = [
    "fastmcp>=2.0.0",
    "web3>=7.0.0",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "eth-account>=0.13.0",
    "python-dotenv>=1.0.0",
    "x402>=0.3.0",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "respx", "ruff", "mypy"]

[project.scripts]
african-rails-mcp = "african_rails_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/african_rails_mcp"]

[tool.ruff]
line-length = 100
target-version = "py310"
